name: live_ride
description: Live Ride — cycling navigation, ride recording and live tracking
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  bluetooth_low_energy: ^6.2.1
  cookie_jar: ^4.0.9
  dio: ^5.9.2
  dio_cookie_manager: ^3.4.0
  file_picker: ^11.0.2
  geolocator: ^14.0.0
  maplibre: 0.3.5
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  # Live Ride parses GPX itself (tolerant, streaming) instead of using a
  # strict document model, so only the XML event reader is needed.
  xml: ^7.0.0
  # Keeps the ride computer readable on a handlebar mount without the rider
  # tapping the screen every 30 seconds.
  wakelock_plus: ^1.5.2
  # Spotify sign-in runs in ASWebAuthenticationSession on iOS, which is what
  # Spotify's PKCE flow expects and what keeps the session cookie out of the app.
  flutter_web_auth_2: ^5.1.0
  # PKCE code challenge.
  crypto: ^3.0.7
  # Ride tracks, routes, segments and bikes live in SQLite: a season of GPS
  # points is far too much for a JSON document store.
  sqflite: ^2.4.4
  path: ^1.9.1
  # Phone battery for LIVE telemetry and the low-battery alert.
  battery_plus: ^7.1.1
  # Accelerometer for crash detection.
  sensors_plus: ^7.1.0
  # Spoken turn and alert callouts in Polish.
  flutter_tts: ^4.2.5
  # Knows when the queued telemetry and rides can be flushed.
  connectivity_plus: ^7.3.1
  # Race mode keeps the screen readable in sunlight.
  screen_brightness: ^2.1.11
  # Route share QR code, rendered locally — no image service involved.
  qr_flutter: ^4.1.0
  # Apple Health / Health Connect workout export.
  health: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Runs the real SQLite schema in unit tests instead of mocking it.
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
